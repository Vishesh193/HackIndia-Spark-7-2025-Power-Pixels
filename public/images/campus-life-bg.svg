<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FEF3C7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FDE68A;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad)" />
  
  <!-- Campus Life Pattern -->
  <g fill="#D97706" opacity="0.1">
    <!-- Buildings -->
    <rect x="50" y="100" width="40" height="150" rx="2" />
    <rect x="110" y="130" width="30" height="120" rx="2" />
    <rect x="160" y="150" width="50" height="100" rx="2" />
    <rect x="230" y="120" width="35" height="130" rx="2" />
    <rect x="290" y="140" width="45" height="110" rx="2" />
    <rect x="360" y="110" width="30" height="140" rx="2" />
    <rect x="410" y="130" width="40" height="120" rx="2" />
    <rect x="470" y="100" width="35" height="150" rx="2" />
    <rect x="520" y="120" width="30" height="130" rx="2" />
    
    <!-- Windows -->
    <rect x="60" y="120" width="10" height="10" rx="1" />
    <rect x="70" y="120" width="10" height="10" rx="1" />
    <rect x="60" y="140" width="10" height="10" rx="1" />
    <rect x="70" y="140" width="10" height="10" rx="1" />
    <rect x="60" y="160" width="10" height="10" rx="1" />
    <rect x="70" y="160" width="10" height="10" rx="1" />
    <rect x="60" y="180" width="10" height="10" rx="1" />
    <rect x="70" y="180" width="10" height="10" rx="1" />
    <rect x="60" y="200" width="10" height="10" rx="1" />
    <rect x="70" y="200" width="10" height="10" rx="1" />
    
    <rect x="120" y="150" width="10" height="10" rx="1" />
    <rect x="120" y="170" width="10" height="10" rx="1" />
    <rect x="120" y="190" width="10" height="10" rx="1" />
    <rect x="120" y="210" width="10" height="10" rx="1" />
    
    <rect x="170" y="170" width="10" height="10" rx="1" />
    <rect x="190" y="170" width="10" height="10" rx="1" />
    <rect x="170" y="190" width="10" height="10" rx="1" />
    <rect x="190" y="190" width="10" height="10" rx="1" />
    <rect x="170" y="210" width="10" height="10" rx="1" />
    <rect x="190" y="210" width="10" height="10" rx="1" />
  </g>
  
  <!-- Sun -->
  <circle cx="500" cy="70" r="30" fill="#D97706" opacity="0.2" />
  <g opacity="0.2" fill="#D97706">
    <rect x="500" y="20" width="2" height="15" rx="1" />
    <rect x="500" y="105" width="2" height="15" rx="1" />
    <rect x="450" y="70" width="15" height="2" rx="1" />
    <rect x="535" y="70" width="15" height="2" rx="1" />
    <rect x="465" y="35" width="10" height="2" rx="1" transform="rotate(-45 465 35)" />
    <rect x="525" y="95" width="10" height="2" rx="1" transform="rotate(-45 525 95)" />
    <rect x="465" y="105" width="10" height="2" rx="1" transform="rotate(45 465 105)" />
    <rect x="525" y="45" width="10" height="2" rx="1" transform="rotate(45 525 45)" />
  </g>
</svg>
