<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E0F2FE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BAE6FD;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad)" />
  
  <!-- Services Pattern -->
  <g fill="#0284C7" opacity="0.1">
    <!-- Roads -->
    <path d="M0,150 L600,150" stroke="#0284C7" stroke-width="20" stroke-dasharray="20,10" />
    <path d="M300,0 L300,300" stroke="#0284C7" stroke-width="20" stroke-dasharray="20,10" />
    
    <!-- Bus Stops -->
    <circle cx="150" cy="150" r="15" />
    <circle cx="300" cy="150" r="15" />
    <circle cx="450" cy="150" r="15" />
    <circle cx="300" cy="75" r="15" />
    <circle cx="300" cy="225" r="15" />
  </g>
  
  <!-- Bus Icon -->
  <g transform="translate(450, 75)" fill="#0284C7" opacity="0.2">
    <rect x="-30" y="-15" width="60" height="30" rx="5" />
    <circle cx="-15" cy="15" r="5" />
    <circle cx="15" cy="15" r="5" />
    <rect x="-25" y="-10" width="10" height="10" rx="2" />
    <rect x="-10" y="-10" width="10" height="10" rx="2" />
    <rect x="5" y="-10" width="10" height="10" rx="2" />
    <rect x="20" y="-10" width="10" height="10" rx="2" />
  </g>
  
  <!-- Bicycle Icon -->
  <g transform="translate(150, 225)" fill="#0284C7" opacity="0.2">
    <circle cx="-15" cy="0" r="10" />
    <circle cx="15" cy="0" r="10" />
    <path d="M-15,0 L0,-15 L15,0 L0,15 Z" />
  </g>
</svg>
