<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FEF2F2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FEE2E2;stop-opacity:0.6" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad)" />
  
  <!-- Calendar Pattern -->
  <g fill="#EF4444" opacity="0.15">
    <rect x="100" y="80" width="200" height="140" rx="5" />
    <rect x="120" y="100" width="30" height="30" rx="2" />
    <rect x="160" y="100" width="30" height="30" rx="2" />
    <rect x="200" y="100" width="30" height="30" rx="2" />
    <rect x="240" y="100" width="30" height="30" rx="2" />
    
    <rect x="120" y="140" width="30" height="30" rx="2" />
    <rect x="160" y="140" width="30" height="30" rx="2" />
    <rect x="200" y="140" width="30" height="30" rx="2" />
    <rect x="240" y="140" width="30" height="30" rx="2" />
    
    <rect x="120" y="180" width="30" height="30" rx="2" />
    <rect x="160" y="180" width="30" height="30" rx="2" />
    <rect x="200" y="180" width="30" height="30" rx="2" />
    <rect x="240" y="180" width="30" height="30" rx="2" />
  </g>
  
  <!-- Event Icon -->
  <g transform="translate(200, 50)">
    <circle cx="0" cy="0" r="15" fill="#EF4444" opacity="0.2" />
    <path d="M-5,-5 L5,5 M-5,5 L5,-5" stroke="#EF4444" stroke-width="2" opacity="0.3" />
  </g>
</svg>
