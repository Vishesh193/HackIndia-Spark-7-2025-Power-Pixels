<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EFF6FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BFDBFE;stop-opacity:0.6" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad)" />
  
  <!-- Services Pattern -->
  <g fill="#3B82F6" opacity="0.15">
    <circle cx="100" cy="100" r="20" />
    <circle cx="300" cy="100" r="20" />
    <circle cx="100" cy="200" r="20" />
    <circle cx="300" cy="200" r="20" />
    <circle cx="200" cy="150" r="30" />
    
    <line x1="100" y1="100" x2="200" y2="150" stroke="#3B82F6" stroke-width="2" opacity="0.15" />
    <line x1="300" y1="100" x2="200" y2="150" stroke="#3B82F6" stroke-width="2" opacity="0.15" />
    <line x1="100" y1="200" x2="200" y2="150" stroke="#3B82F6" stroke-width="2" opacity="0.15" />
    <line x1="300" y1="200" x2="200" y2="150" stroke="#3B82F6" stroke-width="2" opacity="0.15" />
  </g>
</svg>
